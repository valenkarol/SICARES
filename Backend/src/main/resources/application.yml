server:
  port: 8080
  # RNF-05: limita cuántas solicitudes se procesan a la vez (las demás esperan en cola),
  # así el motor de reglas no satura la CPU con 400 solicitudes concurrentes.
  tomcat:
    threads:
      max: 50
    accept-count: 500

spring:
  application:
    name: SICARES

  # ---------- Base de datos MySQL ----------
  datasource:
    url: jdbc:mysql://localhost:3306/sicares_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota
        # RNF-05: carga requisitos y beneficios en lotes (evita una consulta por cada convocatoria en el motor)
        default_batch_fetch_size: 50

  # ---------- Carga de documentos (Sprint 3, HU-22) ----------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ---------- Correo (opcional; ver sicares.notificaciones.correo-habilitado) ----------
  # Para que lleguen a Gmail se necesitan las 3 variables: MAIL_ENABLED=true, MAIL_USER (la cuenta Gmail que envía)
  # y MAIL_PASSWORD (contraseña de APLICACIÓN de 16 letras, no la contraseña normal). Ver guía de correcciones §B.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8              # tildes y ñ correctas en el asunto y el cuerpo
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: smtp.gmail.com
      # El correo se envía en segundo plano (EnviadorCorreo), así que la petición del usuario no espera estos tiempos
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# ---------- Propiedades propias de SICARES ----------
sicares:
  jwt:
    secret: ${JWT_SECRET:c2ljYXJlcy1jbGF2ZS1zZWNyZXRhLWRlLWRlc2Fycm9sbG8tY2FtYmlhci1lbi1wcm9kdWNjaW9u}
    expiracion-minutos: 480
  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:4200}
  admin-inicial:
    correo: admin@sicares.co
    contrasena: Admin123*
  almacenamiento:
    ruta-documentos: ${UPLOAD_DIR:./uploads}
  notificaciones:
    correo-habilitado: ${MAIL_ENABLED:false}
    remitente: ${MAIL_USER:no-reply@sicares.co}
    dias-anticipacion-recordatorio: 3
    # Los recordatorios ya no esperan a las 7:00 a.m.: se revisan automáticamente cada minuto
    # y se envían en cuanto llega su fecha programada (3 días antes de cada fecha importante).
    intervalo-recordatorios-ms: ${RECORDATORIOS_INTERVALO_MS:60000}
    # Obsoleto: lo usaba la versión anterior de ServicioNotificaciones (7:00 a.m.). Se deja para que main siga
    # arrancando mientras se fusiona el paso 3 de la guía; después se puede borrar.
    cron-recordatorios: "0 0 7 * * *"
  politica-datos:
    version: "1.0"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# /actuator/health es público; /actuator/metrics solo para ADMINISTRADOR.
# Nginx no reenvía /actuator: en el servidor se consulta con curl a localhost:8080.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  # El correo es opcional (ADR-06): si no hay credenciales, /actuator/health no debe quedar en DOWN
  health:
    mail:
      enabled: false
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95
