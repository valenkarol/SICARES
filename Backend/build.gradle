plugins {
    id 'java'
    id 'jacoco'   // RNF/métrica "Cobertura de pruebas": reporte en build/reports/jacoco/test/html/index.html
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sicares'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Capa web (controllers REST) ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // --- Capa de persistencia (JPA / Hibernate) ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // --- Seguridad (autenticación y roles) ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // --- Validaciones (@NotBlank, @Email, @Past, ...) ---
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // --- Correo para notificaciones y recordatorios (Sprint 3, HU-26) ---
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // --- Métricas de tiempos de respuesta y salud del servicio (RNF-04, RNF-05, RNF-06, RNF-11) ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- JWT (token de sesión) ---
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- Documentación de la API (Swagger UI en /swagger-ui.html) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // --- Driver MySQL ---
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Lombok (getters/setters/constructores) ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Pruebas (JUnit 5 + Mockito + H2 en memoria para tests) ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Reporte de cobertura de pruebas (métrica "Cobertura de pruebas" del Plan de Calidad, sección 3.3)
jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = false
    }
}

// Solo genera el jar ejecutable (evita el *-plain.jar que confunde al Dockerfile)
tasks.named('jar') {
    enabled = false
}